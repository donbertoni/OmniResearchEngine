[alembic]
script_location = migrations
# sqlalchemy.url is intentionally NOT set here -- migrations/env.py reads it
# from the DATABASE_URL environment variable instead, so the same
# connection string used everywhere else in this project (see
# omni/adapters/persistence/postgres/connection.py) is the single source of
# truth. Never commit a real connection string into this file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
